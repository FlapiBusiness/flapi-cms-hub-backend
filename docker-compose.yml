services:
  adonis:
    container_name: adonis
    image: flapi/cms-hub-backend:develop
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3556:3556'
    depends_on:
      - db_mariadb
      - phpmyadmin
    networks:
      - app-network

  db_mariadb:
    container_name: db_mariadb
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flapi-cms-hub_develop
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - '3310:3306'
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - app-network

  nats:
    container_name: nats
    image: nats:latest
    restart: always
    ports:
      - '4222:4222' # NATS client connections
      - '4223:4223' # WebSocket connections
      - '8222:8222' # HTTP monitoring
    volumes:
      - ./nats/nats_config.json:/etc/nats/nats_config.json # Mount a configuration file
      - nats_data:/data/nats # Mount a volume for JetStream data storage
    command: -c /etc/nats/nats_config.json
    networks:
      - app-network

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db_mariadb
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - '7500:80'
    networks:
      - app-network

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog
    logging:
      driver: 'none' # disable saving logs
    environment:
      - MH_USERNAME=support@develop.flapi.org
      - MH_PASSWORD=fakepassword
    ports:
      - '1025:1025' # smtp server
      - '8025:8025' # web ui
    networks:
      - app-network

  gh-webhook:
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://host.docker.internal:3556/webhook || exit 1
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    depends_on:
      - adonis
    build:
      context: .
      dockerfile: DockerfileGithubWebhook
    env_file:
      - .env
    environment:
      - GITHUB_WEBHOOK_ACCESS_TOKEN=${GITHUB_WEBHOOK_ACCESS_TOKEN}
      - GITHUB_USERNAME_OR_ORGANIZATION=${GITHUB_USERNAME_OR_ORGANIZATION}
    networks:
      - app-network

networks:
  app-network:

volumes:
  database_data:
  app:
  node_modules:
  nats_data:
